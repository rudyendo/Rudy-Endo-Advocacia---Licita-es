              {
                "@type": "Question",
                "name": "Minha empresa nunca participou de licitação. Por onde começar?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Pelo cadastro nas plataformas de compras públicas, pela organização das certidões e atestados e pela leitura cuidadosa do edital. ME e EPP contam com tratamento diferenciado pela Lei Complementar 123/2006, como prazo para regularizar a situação fiscal."
                }
              },
              {
                "@type": "Question",
                "name": "Qual é o prazo para recorrer?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Pela Lei 14.133/2021, a intenção de recorrer deve ser manifestada logo após a decisão, e as razões do recurso são apresentadas em 3 dias úteis. Por isso é importante falar com o advogado antes da sessão."
                }
              },
              {
                "@type": "Question",
                "name": "Até quando posso impugnar um edital?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Até 3 dias úteis antes da data de abertura da licitação."
                }
              },
              {
                "@type": "Question",
                "name": "Quando é possível pedir reequilíbrio do contrato?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Quando fatos imprevisíveis — ou previsíveis, mas de consequências incalculáveis — tornam o contrato excessivamente oneroso, como alta extraordinária de insumos. O pedido precisa ser bem documentado."
                }
              },
              {
                "@type": "Question",
                "name": "O órgão está atrasando os pagamentos. O que fazer?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "É possível notificar, cobrar correção e, em atrasos superiores a 2 meses, a lei permite à empresa pedir a extinção do contrato ou suspender sua execução. Cada caso precisa ser analisado antes de qualquer medida."
                }
              },
              {
                "@type": "Question",
                "name": "Vocês atendem empresas de qualquer estado?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Sim. A maior parte das licitações é eletrônica, e o atendimento é feito online para empresas de todo o Brasil."
                }
              },
              {
                "@type": "Question",
                "name": "O que é a assessoria integral?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "É o acompanhamento da empresa em todas as etapas: análise de editais, documentação de habilitação, acompanhamento da disputa nas plataformas, impugnações, recursos e gestão dos contratos firmados. A empresa pode contratar a assessoria integral (mensal) ou apenas uma demanda específica. Se já tiver uma assessoria de licitações, trabalhamos em conjunto com ela."
                }
              },

                "@type": "Question",
